<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AR Lịch sử địa phương</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #huongdan {
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;

            background: rgba(0, 0, 0, 0.70);
            color: white;

            padding: 12px;

            text-align: center;

            border-radius: 10px;

            z-index: 1000;

            font-size: 16px;
        }

    </style>

</head>


<body>


    <!-- Hướng dẫn cho người sử dụng -->

    <div id="huongdan">

        📱 Đưa camera vào ảnh di tích

    </div>


    <!-- Khu vực AR -->

    <a-scene

        mindar-image="
            imageTargetSrc: ./ditich.mind;
        "

        color-space="sRGB"

        renderer="colorManagement: true, physicallyCorrectLights: true"

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="
            enabled: false
        ">


        <!-- Camera -->

        <a-camera

            position="0 0 0"

            look-controls="enabled: false">

        </a-camera>


        <!-- Target số 0 -->

        <a-entity

            mindar-image-target="
                targetIndex: 0
            ">


            <!-- Hình chữ nhật màu xanh -->

            <a-plane

                color="#00AEEF"

                opacity="0.65"

                position="0 0 0"

                width="1"

                height="0.56">

            </a-plane>


        </a-entity>


    </a-scene>


</body>

</html>
